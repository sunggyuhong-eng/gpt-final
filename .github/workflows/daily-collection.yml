name: Daily Collection

on:
  schedule:
    # 00:15 UTC = 09:15 Asia/Seoul; day 1 is reserved for monthly workflow.
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - name: Skip the first day of month
        id: calendar
        run: echo "run=$([ "$(TZ=Asia/Seoul date +%d)" != '01' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.calendar.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.calendar.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - if: steps.calendar.outputs.run == 'true'
        run: pip install -r requirements.txt
      - if: steps.calendar.outputs.run == 'true'
        run: python scripts/run_pipeline.py --mode daily
      - name: Commit daily snapshot
        if: steps.calendar.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data logs)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          git commit -m "data: update daily hiring snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
