name: Generate GPT Report - OpenAI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openai-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-gpt-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify OpenAI API key
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository Secret OPENAI_API_KEY가 없습니다. Settings > Secrets and variables > Actions에서 등록해 주세요."
            exit 1
          fi

      - name: Generate GPT report from saved snapshots
        run: python scripts/generate_existing_report.py

      - name: Run tests
        run: python -m pytest -q

      - name: Commit generated report
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/reports reports)" ]; then
            echo "::error::생성된 리포트 변경사항이 없습니다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports reports
          git commit -m "report: generate OpenAI GPT monthly analysis"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
