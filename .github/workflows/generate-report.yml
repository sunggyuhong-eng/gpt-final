name: Generate AI Report

on:
  workflow_dispatch:
    inputs:
      use_claude_tokens:
        description: 'Claude API 토큰을 사용해 현재 데이터의 리포트 생성'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Confirm manual token usage
        run: |
          if [ "${{ inputs.use_claude_tokens }}" != "true" ]; then
            echo "::error::Run workflow에서 Claude 토큰 사용 항목을 체크해야 합니다."
            exit 1
          fi
      - name: Verify Claude API key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository Secret ANTHROPIC_API_KEY가 없습니다."
            exit 1
          fi
      - name: Generate report from saved snapshots
        run: python scripts/generate_existing_report.py
      - run: python -m pytest -q
      - name: Commit generated report
        run: |
          if [ -z "$(git status --porcelain -- data/reports reports)" ]; then
            echo "::error::생성된 리포트 변경사항이 없습니다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports reports
          git commit -m "report: generate Claude monthly analysis"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
