name: Check Gamejob Connection

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-connection:
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - name: Check robots and public job list
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          endpoints = [
              ("robots.txt", "https://www.gamejob.co.kr/robots.txt"),
              ("public job list", "https://www.gamejob.co.kr/Recruit/joblist?menucode=searchdetail"),
          ]
          lines = ["Gamejob connection diagnostic", datetime.now(timezone.utc).isoformat()]
          lines.append("This workflow only checks HTTP responses; it does not collect jobs or call GPT.")
          lines.append("A green workflow means the check finished, not that both URLs were reachable.")
          for label, url in endpoints:
              lines.extend(["", f"[{label}]", f"URL: {url}"])
              command = [
                  "curl", "--silent", "--show-error", "--location", "--max-redirs", "5",
                  "--connect-timeout", "10", "--max-time", "25",
                  "--user-agent", "GameHiringRadar/1.0 (+public-research; contact via repository issues)",
                  "--output", "/dev/null", "--write-out", "%{json}", url,
              ]
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=35)
                  lines.append(f"curl_exit_code: {result.returncode}")
                  try:
                      metrics = json.loads(result.stdout)
                  except ValueError:
                      metrics = {}
                  for key in ("http_code", "remote_ip", "time_namelookup", "time_connect",
                              "time_appconnect", "time_starttransfer", "time_total", "url_effective"):
                      lines.append(f"{key}: {metrics.get(key, 'unavailable')}")
                  if result.stderr.strip():
                      lines.append(f"error: {result.stderr.strip()[:1000]}")
              except subprocess.TimeoutExpired:
                  lines.append("error: curl subprocess exceeded 35 seconds")
          report = "\n".join(lines)
          print(report)
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("## 게임잡 연결 진단 결과\n\n아래 결과를 복사해서 전달해 주세요.\n\n```text\n" + report + "\n```\n", encoding="utf-8")
          PY
